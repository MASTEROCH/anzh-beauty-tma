name: Deploy to GitHub Pages

# Only master can deploy: the github-pages environment restricts deployments
# to the default branch, so a run from any other branch fails at that gate —
# and, sharing the concurrency group below, would cancel a real deploy.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pages serves the site from /<repo>/, so the bundle has to carry that
      # base — every public asset resolves through it (src/lib/asset.ts).
      - name: Build
        run: npx vite build --base="/${{ github.event.repository.name }}/"

      # Hash routing means deep links stay on index.html, but a stray path
      # should land on the app rather than a GitHub 404 page.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
